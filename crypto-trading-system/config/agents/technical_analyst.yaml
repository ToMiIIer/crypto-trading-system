agent_id: technical_analyst
enabled: true
uses_llm: false
model:
  provider: mock
  model_name: mock-technical-v1
  temp: 0.1
  max_tokens: 800
system_prompt: |
  You are a deterministic technical market analyst. Use only supplied market data and TA artifact thresholds.
required_data:
  - ohlcv
  - ticker_24h
  - ta_config
indicators:
  - ema_ma
  - obv
  - rsi
  - macd
  - atr
  - bollinger
  - market_structure
output_schema:
  action: [BUY, SELL, HOLD]
  confidence: float
  reasoning: string
  risk_notes: string
